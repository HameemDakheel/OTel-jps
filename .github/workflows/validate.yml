name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install pyyaml mkdocs-material

      - name: Validate YAML configs
        run: |
          set -e
          for f in \
            configs/otel-collector/config.yaml \
            configs/prometheus/prometheus.yml \
            configs/tempo/tempo.yaml \
            configs/pyroscope/pyroscope.yaml \
            configs/grafana/provisioning/datasources/all.yaml \
            configs/grafana/provisioning/dashboards/dashboards.yaml \
            configs/grafana/provisioning/alerting/contact-points.yaml \
            configs/grafana/provisioning/alerting/notification-policies.yaml \
            alerts/default-rules.yaml \
            mkdocs.yml \
            templates/coolify/docker-compose.yml \
            templates/dokploy/docker-compose.yml \
            templates/caprover/caprover-one-click-app.yml; do
            echo "Validating $f"
            python3 -c "import yaml; yaml.safe_load(open('$f'))"
          done

      - name: Validate JSON templates and dashboards
        run: |
          set -e
          for f in \
            templates/coolify/coolify-template.json \
            templates/dokploy/template.json \
            templates/caprover/captain-definition \
            templates/jelastic/manifest.jps \
            templates/jelastic/linker.jps \
            configs/grafana/dashboards/stack-health.json \
            configs/grafana/dashboards/container-metrics.json \
            configs/grafana/dashboards/logs-explorer.json \
            configs/grafana/dashboards/traces-browser.json \
            configs/grafana/dashboards/frontend-rum.json; do
            echo "Validating $f"
            python3 -c "import json; json.load(open('$f'))"
          done

      - name: Validate docker-compose merges
        env:
          BASIC_AUTH_HASH: 'placeholder-bcrypt-hash-only-for-config-render'
        run: |
          docker compose -f docker-compose.yml -f compose/simple.yml config --quiet
          docker compose -f docker-compose.yml -f compose/standard.yml config --quiet
          # compose/otel-demo.yml was removed in 809fa61 ("remove old internal-network demo
          # overlay, replaced by examples/otel-demo/ in v1.1") — this merge check was never
          # updated to match, and has been referencing a deleted file since. The demo now runs
          # via its own compose project (examples/otel-demo/, driven by scripts/demo-up.sh and
          # the Makefile's demo-up target), which is a separate, self-contained compose
          # invocation with its own env files — not a profile overlay on the base stack — so
          # there is nothing to merge-check here. Fixed 2026-08-24.

      - name: Validate Caddyfile
        run: |
          docker run --rm -v "$PWD/configs/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate OTel Collector config
        run: |
          # The hostmetrics receiver's root_path: /hostfs (added in v1.1) needs that path to
          # actually exist, or `validate` fails with "invalid root_path: stat /hostfs: no such
          # file or directory" - this step has been failing on every push since v1.1 landed,
          # four months ago, because it never supplied this mount. Real docker-compose.yml
          # bind-mounts the host's / as /hostfs:ro,rslave for the real service; matched here
          # with a plain :ro mount (rslave is a mount-propagation flag, meaningless for a
          # one-shot `docker run` with no nested mounts to propagate). Confirmed fixed
          # 2026-08-24 by running this exact command with and without the mount locally.
          # Bumped 0.111.0 -> 0.153.0 for Task 4 (RUM) - the faro receiver this
          # config now uses does not exist in 0.111.0 at all. FRONTEND_ORIGIN
          # supplied explicitly (placeholder value) so the config's own
          # ${env:FRONTEND_ORIGIN} expansion has something real to resolve,
          # matching how BASIC_AUTH_HASH is supplied as a placeholder for the
          # compose-merge step above.
          docker run --rm -v "$PWD/configs/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            -v "/:/hostfs:ro" \
            -e FRONTEND_ORIGIN="https://placeholder-for-config-validation.invalid" \
            otel/opentelemetry-collector-contrib:0.153.0 validate --config=/etc/otelcol-contrib/config.yaml

      - name: Validate Prometheus alert rules
        run: |
          set -e
          docker run --rm -v "$PWD/alerts:/etc/prometheus/rules:ro" \
            --entrypoint promtool prom/prometheus:v3.0.1 check rules /etc/prometheus/rules/default-rules.yaml
          for f in alerts/optional/*.yaml; do
            echo "Validating $f"
            docker run --rm -v "$PWD/alerts:/etc/prometheus/rules:ro" \
              --entrypoint promtool prom/prometheus:v3.0.1 check rules "/etc/prometheus/rules/optional/$(basename "$f")"
          done

      - name: Validate bash scripts (syntax)
        run: |
          set -e
          for f in scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Build MkDocs site (strict)
        run: |
          mkdocs build --strict --site-dir /tmp/mkdocs-site

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -e SC1091 -e SC2086
        with:
          scandir: scripts
