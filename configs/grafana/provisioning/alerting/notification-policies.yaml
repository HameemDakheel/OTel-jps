apiVersion: 1

policies:
  # Default receiver is email, not the webhook — this deployment's own choice, set
  # here rather than left generic, because it needs to actually be correct out of
  # the box for this instance. To switch to webhook instead (Slack/Discord/
  # PagerDuty), change `default-email` to `default-webhook` below — both contact
  # points are always defined (contact-points.yaml), so switching is a one-line
  # change here, not a rebuild.
  - orgId: 1
    receiver: default-email
    group_by: [alertname, severity]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: blackhole
        matchers:
          - severity = info
        continue: false
