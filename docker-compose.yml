# obstack base compose file.
# This file declares networks and volumes; services are layered in by `compose/<profile>.yml`.
# Run with: docker compose -f docker-compose.yml -f compose/simple.yml up -d
# Or via:    make simple

networks:
  obs-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  victorialogs_data:
  tempo_data:
  pyroscope_data:
  grafana_data:

# Service blocks are appended below as Tasks 6–12 land.
services:
  caddy:
    image: caddy:2-alpine
    container_name: obstack-caddy
    restart: unless-stopped
    networks:
      - obs-net
    ports:
      - "80:80"
      - "443:443"
      - "4317:4317"   # OTLP gRPC
      - "4040:4040"   # Pyroscope continuous-profiling ingest (basic auth, see Caddyfile)
      - "8027:8027"   # Faro RUM ingest (basic auth, see Caddyfile)
    volumes:
      - ./configs/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-ingest}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    depends_on:
      grafana:
        condition: service_started
      otel-collector:
        condition: service_started
      pyroscope:
        condition: service_started

  otel-collector:
    # Bumped 0.111.0 -> 0.153.0 for Task 4 (RUM): the faro receiver does not
    # exist in 0.111.0 at all ("unknown type: faro", confirmed directly by
    # running `... validate` against it) - it was added to the contrib
    # distribution somewhere between these two releases. 0.153.0 chosen
    # deliberately, not just "the latest" - it's the exact version already
    # proven live in a real production deployment (UniContentAPI's own OTel
    # Collector, in the UOT main-site workspace), so this pin carries real
    # evidence of working, not just a version number. See docs/operations/upgrade.md.
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: obstack-otelcol
    restart: unless-stopped
    networks:
      - obs-net
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./configs/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /:/hostfs:ro,rslave    # for hostmetrics receiver (v1.1+)
    environment:
      # Read by the faro receiver's CORS config (configs/otel-collector/config.yaml)
      # via ${env:FRONTEND_ORIGIN}. Must be your real frontend's origin in
      # production - the browser posts here cross-origin, so CORS has to name
      # it exactly. Dev-friendly default so a fresh local `make simple` boots
      # without requiring this to be set first.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    expose:
      - "4317"   # gRPC OTLP (Caddy fronts this)
      - "4318"   # HTTP OTLP
      - "8027"   # Faro RUM ingest (Caddy fronts this — see :8027 block in Caddyfile)
      - "8888"   # Self-metrics
      - "13133"  # health_check
    depends_on:
      prometheus:
        condition: service_started
      victorialogs:
        condition: service_started
      tempo:
        condition: service_started
      pyroscope:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: obstack-prometheus
    restart: unless-stopped
    networks:
      - obs-net
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --web.enable-remote-write-receiver
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5

  victorialogs:
    image: victoriametrics/victoria-logs:v1.1.0-victorialogs
    container_name: obstack-victorialogs
    restart: unless-stopped
    networks:
      - obs-net
    command:
      - --storageDataPath=/vlogs
      - --retentionPeriod=${VICTORIALOGS_RETENTION:-7d}
      - --httpListenAddr=0.0.0.0:9428
      - --loggerLevel=INFO
    volumes:
      - victorialogs_data:/vlogs
    expose:
      - "9428"

  tempo:
    image: grafana/tempo:2.6.1
    container_name: obstack-tempo
    restart: unless-stopped
    networks:
      - obs-net
    command:
      - -config.file=/etc/tempo/tempo.yaml
      - -config.expand-env=true
    volumes:
      - ./configs/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    expose:
      - "3200"   # HTTP query
      - "4317"   # OTLP gRPC
      - "4318"   # OTLP HTTP (collector pushes here)
      - "9095"   # gRPC native
    environment:
      TEMPO_RETENTION_HOURS: ${TEMPO_RETENTION_HOURS:-72}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 5s
      retries: 5

  pyroscope:
    image: grafana/pyroscope:1.10.0
    container_name: obstack-pyroscope
    restart: unless-stopped
    networks:
      - obs-net
    command: ["-config.file=/etc/pyroscope/pyroscope.yaml"]
    volumes:
      - ./configs/pyroscope/pyroscope.yaml:/etc/pyroscope/pyroscope.yaml:ro
      - pyroscope_data:/data
    expose:
      - "4040"
    environment:
      PYROSCOPE_RETENTION_HOURS: ${PYROSCOPE_RETENTION_HOURS:-336}

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: obstack-cadvisor
    restart: unless-stopped
    networks:
      - obs-net
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project

  grafana:
    image: grafana/grafana:11.3.0
    container_name: obstack-grafana
    restart: unless-stopped
    networks:
      - obs-net
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
      GF_FEATURE_TOGGLES_ENABLE: traceToProfiles tracesEmbeddedFlameGraph
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-https://${DOMAIN:-localhost}/}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-https://example.invalid/alert}
      # Email alerting (added alongside the webhook path — see
      # configs/grafana/provisioning/alerting/contact-points.yaml for which one is
      # actually the default receiver). Grafana's own SMTP client env vars, passed
      # through unchanged so any provider works — Microsoft 365, Gmail, SES, etc.
      # SMTP_ENABLED defaults to false so an obstack deployment with no SMTP_* set
      # doesn't try to connect anywhere and fail loudly on every alert.
      GF_SMTP_ENABLED: ${SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${SMTP_HOST:-smtp.office365.com:587}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-alerts@example.invalid}
      GF_SMTP_FROM_NAME: ${SMTP_FROM_NAME:-obstack Alerts}
      GF_SMTP_STARTTLS_POLICY: ${SMTP_STARTTLS_POLICY:-MandatoryStartTLS}
      ALERT_EMAIL_ADDRESSES: ${ALERT_EMAIL_ADDRESSES:-alerts@example.invalid}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      prometheus:
        condition: service_started
      victorialogs:
        condition: service_started
      tempo:
        condition: service_started
      pyroscope:
        condition: service_started
