# OpenTelemetry Collector contrib config — Simple profile.
# Receives OTLP, fans out to Prometheus (metrics), VictoriaLogs (logs),
# and Tempo (traces). Profiles export to Pyroscope is wired in Phase 2.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Frontend RUM (Real User Monitoring) — the Grafana Faro Web SDK.
  # Own dedicated port (8027), mirroring the pattern this file already uses for
  # Pyroscope (see configs/caddy/Caddyfile's :4040 block, and its own comment on
  # why a dedicated port beats a path prefix): the browser posts here directly,
  # not through the OTLP endpoints above. Port and CORS shape verified against a
  # real production OTel Collector config already running this exact receiver
  # (UniContentAPI/deploy/collector/config.yaml in the UOT main-site workspace) —
  # not invented from scratch. FRONTEND_ORIGIN must be your real frontend's
  # origin (e.g. https://example.com), not a wildcard — the browser sends this
  # request cross-origin, so CORS has to name it exactly.
  faro:
    endpoint: 0.0.0.0:8027
    cors:
      allowed_origins:
        - "${env:FRONTEND_ORIGIN}"
      allowed_headers:
        - "*"

  # Self-monitoring: scrape the collector's own /metrics
  prometheus/self:
    config:
      scrape_configs:
        - job_name: otel-collector-self
          scrape_interval: 30s
          static_configs:
            - targets: ['localhost:8888']

  # Host metrics — host CPU/RAM/disk/network/load (v1.1+).
  # Requires the otel-collector container to bind-mount / as /hostfs:ro.
  hostmetrics:
    collection_interval: 30s
    root_path: /hostfs
    scrapers:
      cpu:
      memory:
      disk:
      filesystem:
      network:
      load:
      paging:
      processes:

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 75
    spike_limit_percentage: 25

  batch:
    timeout: 200ms
    send_batch_size: 8192
    send_batch_max_size: 16384

  resourcedetection:
    detectors: [env, system]
    timeout: 2s

exporters:
  # Metrics → Prometheus remote-write
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true

  # Logs → VictoriaLogs OTLP receiver
  otlphttp/logs:
    endpoint: http://victorialogs:9428/insert/opentelemetry
    tls:
      insecure: true

  # Traces → Tempo OTLP HTTP
  otlphttp/tempo:
    endpoint: http://tempo:4318
    tls:
      insecure: true

  # Continuous profiling deliberately does NOT go through this collector.
  # Confirmed 2026-08-24 (Grafana's own Go client docs): pyroscope-go pushes
  # directly to Pyroscope's own HTTP ingest API — it was never going to
  # arrive here as OTLP. The OTel Collector's own profiles signal IS a real,
  # separate path (an otlp_grpc exporter to Pyroscope, gated behind
  # --feature-gates=service.profilesSupport upstream), but Grafana's docs
  # describe it as still under active development with breaking changes —
  # this file previously said "wired in Phase 2... still maturing" about
  # that collector-mediated path, and that reasoning was directionally
  # right, but no Phase ever actually gave applications ANY way to send a
  # profile, collector-mediated or not: Pyroscope's port had no public route
  # at all until configs/caddy/Caddyfile's :4040 block (2026-08-24). Fixed
  # by exposing Pyroscope's stable direct-push API instead of waiting on the
  # experimental collector path. See that Caddyfile block's own comment for
  # the full reasoning, including why it's a dedicated port and not a
  # /pyroscope/* prefix under the main site.

  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    # Old `address: 0.0.0.0:8888` shape was removed somewhere between 0.111.0
    # and 0.153.0 (the version bump Task 4 needed for the faro receiver to
    # exist at all) - confirmed directly, `validate` rejected it outright:
    # "'migration.MetricsConfigV030' has invalid keys: address". Replaced with
    # the shape UOT's own production collector already runs on this exact
    # version (UniContentAPI/deploy/collector/config.yaml) rather than guessed.
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp, prometheus/self, hostmetrics]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [prometheusremotewrite]
    logs:
      # faro contributes browser exceptions/console logs into the SAME
      # VictoriaLogs backend everything else uses — no new pipeline, no new
      # exporter, per the plan this was built from.
      receivers: [otlp, faro]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp/logs]
    traces:
      # faro contributes browser (RUM) spans into the SAME Tempo backend
      # everything else uses.
      receivers: [otlp, faro]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp/tempo]
